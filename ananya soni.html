<html>
<head>
    <title>Student Registration Form</title>
</head>

<body bgcolor="#D6EAF8">

    <h1 align="center">
        <font color="#154360">Student Registration Form</font>
    </h1>

    <table align="center" bgcolor="white" cellpadding="12">
        <tr>
            <td>

                <form>

                    <font color="#2874A6">
                        <h3 align="center">Register Here!</h3>
                    </font>

                    Name:
                    <input type="text" name="name">
                    <br><br>

                    Password:
                    <input type="password" name="password">
                    <br><br>

                    Date of Birth:
                    <input type="date" name="dob">
                    <br><br>

                    Favourite Colour:
                    <input type="color" name="colour">
                    <br><br>

                    Gender:
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                    <br><br>

                    Hobbies:
                    <br>
                    <input type="checkbox"> Reading
                    <input type="checkbox"> Playing
                    <input type="checkbox"> Dancing
                    <br><br>

                    Select Class:
                    <select name="class">
                        <option>Class 8</option>
                        <option>Class 9</option>
                        <option>Class 10</option>
                        <option>Class 11</option>
                        <option>Class 12</option>
                    </select>
                    <br><br>

                    Email:
                    <input type="email" name="email">
                    <br><br>

                    <center>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </center>

                </form>

            </td>
        </tr>
    </table>

</body>
</html>
